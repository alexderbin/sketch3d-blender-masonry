# The form language of buildings (temples, edifices, castles): a family is a set of genes; historical styles,
# fantasy and sci-fi are points of one space. Meters; [from, to] — a spread by seed; fractions —
# of the span W or the height H. A categorical gene is {variant: weight} or a single value.
# A mix of families: style=a+b or a:0.6,b:0.4 (numbers — weighted, variants — weights add up). Inheritance — base.
# Read by style/style_genes.py; used by temples/temple_plan.py, edifices/edifice_plan.py.

categorical: [plan, arch, vault, east, roof, crossing.kind, tower.spire, buttress.kind, win.tracery, west.towers, central.kind,
              central.dome, central.corner_domes, ziggurat.top, ed.type, ed.shrine_roof, ed.ring_obj, ed.edge, ed.column]

families:
  romanesque:                # Speyer, Cluny: a semicircular arch, thick walls, square bays, an apse, a westwork
    lineage: west
    era: 0
    plan: basilica
    W: [11.0, 14.0]          # nave span between axes
    HW: [2.0, 2.4]           # vault height / span
    A: 0.5                   # side aisle / span
    HA: 0.5                  # side-aisle vault / nave vault
    B: 1.0                   # nave bay / span (a square — a bound system: two side-aisle bays to one nave bay)
    aisle_bays: 2
    choir_aisles: false      # a choir without side aisles (Speyer)
    elevation: {tribune: 0.45, clerestory: 0.55}   # fractions of the wall above the arcade up to the springing of the vault: the triforium (gallery) and the clerestory
    tri_n: 2                 # gallery openings per side-aisle bay
    aisle_pitch: 22          # slope of the side-aisle roof, degrees
    arch: round              # semicircular, pointed, lancet, ogee, horseshoe, parabola, stepped, lintel
    vault: groin             # groin — a groin vault, rib4 — a ribbed vault, star — a star vault, barrel — a barrel vault, flat — flat with beams
    roof: gable              # gable — a gabled roof, terrace — flat with a parapet
    t: 2.2                   # wall thickness
    pier: 0.16               # pier side / span
    pier_kind: square
    buttress: {depth: 0.07, w: 0.12, flyers: 0, kind: lesene}   # pilaster strips; buttress tiers; the pier kind
    win: {aisle: [0.28, 0.55], clerestory: [0.3, 0.7], tracery: none}   # window: width / the span between piers, height / zone
    roof_pitch: 32
    nave_bays: [5, 7]
    choir_bays: [2, 3]
    transept: [1, 1]         # bays in a transept arm
    east: apse
    chapels: [0, 0]
    west: {towers: 2, tower_k: 2.0, portals: 1, rose: 0.0}   # towers — in vault heights
    tower: {stage_h: 8.0, taper: 0.97, octagon: 0.0, spire: {pyramid: 0.6, helm: 0.4}, spire_k: [0.18, 0.26], buttresses: false,
            pinnacles: false, open: round, max_stages: 4}
    crossing: {kind: tower, k: 1.7}
    spikes: 0.0              # fractions 0–1: spikes, irregularity, organic, fortress, factory
    irregular: 0.2
    organic: 0.0
    fortified: 0.15
    industrial: 0.0
    colors: {stone: [0.70, 0.56, 0.46], roof: [0.42, 0.24, 0.18], accent: [0.45, 0.47, 0.50], hole: [0.05, 0.05, 0.06]}
