# Houses — knowledge for the "house" type; dwellings and shops are the bulk of a settlement. A house kind = an outline
# on the plot, yard, storeys, roof, openings, shop, jetties, colors. The ensemble picks the kind by archetype
# (../ensembles/settlements.yaml), the house picks its parameters by the plot's seed; rank (the kind's wealth) and
# trade (suitability for shops) are for the influences (../influences/): the house kind by the plot's wealth and the
# street flow; by_wealth — which color lists run from poor to rich (the color follows the plot's wealth, not chance);
# cheap — features that are more common among the poor (half-timbering, jetties, galleries, balconies; by default
# half-timbering and jetties).
# Meters, degrees; [a, b] — a range; color — a list of variants (rgb 0–1).

kinds:
  court_greek:
    what: "a house with a yard (Olynthus, Priene; Hoepfner–Schwandner): the main wing on the north, 1–2 storeys, with a pastas portico toward the yard; the side wings, the shops by the street and the yard wall are random; roofs slope toward the yard, toward the street — a tall blank wall, one door"
    rank: 0.55                         # the kind's wealth 0–1: the poorer the plot, the likelier a kind with a lower rank
    trade: 0.5                          # suitability for shops 0–1: the busier the street, the likelier
    outline: plot
    storey: 3.0
    makeup: wings
    wings:
      main: {depth: [4.6, 6.0], portico: [2.4, 3.0], height: [3.9, 4.3], gable: 0.25}   # height of the first storey; gable — the share of gabled ones
      flank: {frac: 0.55, depth: [3.0, 4.0], height: [2.7, 3.0]}
      street: {frac: 0.45, depth: [3.2, 4.2], height: [2.8, 3.2], shops: 0.5}            # by the street — shops and workshops
      fence: [2.8, 3.3]                                                                      # a yard wall where there is no wing
      court_min: [4.5, 0.18]                                                                   # the yard is no narrower than 4.5 m and no less than 18 % of the plot
    roof: {kind: pitch, slope: [15, 19], overhang: 0.4}
    windows: {rhythm: 3.2, w: [0.7, 0.9], h: [0.9, 1.1], sill: 1.6, kind: rect, street: few}   # toward the street — small windows under the ceiling
    shop: {frac: 1.0, w: [2.2, 2.8], h: [2.4, 2.7], kind: rect, rhythm: 4.2}
    door: {w: [1.2, 1.6], h: [2.3, 2.6], kind: rect}
    wall: 0.5
    by_wealth: [wall]              # raw ochre → whitewash
    color: {wall: [[0.76, 0.66, 0.52], [0.82, 0.74, 0.62], [0.86, 0.8, 0.68], [0.9, 0.87, 0.8], [0.92, 0.9, 0.85]], roof: [[0.64, 0.35, 0.23], [0.58, 0.31, 0.21], [0.68, 0.4, 0.27]],
