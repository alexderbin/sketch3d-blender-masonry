# Timber knowledge (components/constructions/timber/): wooden wall and fence structures — fachwerk, log house, cladding,
# palisade, wattle; real-life sizes, in meters. Read by timber.py (the project's Python; in Blender — from the plan).
# The logic is masonry made of beams and logs: a wall is an unrolling (u along the wall, z is height) as in masonry;
# fachwerk is a frame built by the carpenter's rules (posts at corners and openings, rails, braces, the sill and wall
# plate of a storey), a log house has courses bonded at the corners (neighboring walls shifted by half a course), a
# palisade and wattle run along a line on the ground.
# Sources: [f] — reference books and standards, [s] — craft sources, [p] — from memory.

version: 1

# settlement house kind (the Buildings plan type, occupancy layer: house.type) → whole walls; other houses — as the
# settlement built them
houses:
  izba: log_oblo

base:
  generator: fachwerk          # fachwerk | log house | cladding | palisade | wattle
  substance: oak_dark
  infill: plaster         # substance of the fachwerk infill
  role: wood
  spread: 0.06
  liveliness: 1.0

substances:
  oak_dark:      [0.10, 0.07, 0.05]   # stained and tarred fachwerk beam
  oak:           [0.30, 0.20, 0.12]
  pine:          [0.42, 0.30, 0.18]   # fresh log house
  pine_grey:     [0.34, 0.31, 0.27]   # old gray log
  plaster:       [0.78, 0.74, 0.64]   # lime plaster
  plaster_ochre: [0.72, 0.58, 0.36]   # ochre
  daub:          [0.50, 0.42, 0.30]   # clay daub
  moss:          [0.16, 0.15, 0.10]   # moss in the log-house grooves
  brick:         [0.40, 0.18, 0.12]   # brick infill

kinds:
  fachwerk:
    title: "fachwerk (German, \"little men\")"   # [f] sill 14/26–14/32, posts 14/16–14/18 cm, wall plate 12–16 cm; posts ≤ 1 m
    generator: fachwerk
    post: [0.16, 0.18]          # width in the wall, projection (offset from the plane)
    threshold: [0.24, 0.16]           # height, projection
    plate: [0.16, 0.16]
    rail: [0.14, 0.14]
    brace: [0.16, 0.16]
    step: 1.0                      # posts no sparser than
    levels: [0.85, 2.0]           # rails above the storey floor: below-window, above-window (at windows — by the opening)
    pattern: mann               # mann — braces at corner posts over half a storey (Mann); crosses — St. Andrew's crosses under the windows; no — none
    infill: plaster
  fachwerk_close:
    title: "fachwerk with close posts (English)"   # [p] close studding: posts every 0.4 m, a middle rail
    generator: fachwerk
    post: [0.16, 0.16]
    threshold: [0.22, 0.16]
    plate: [0.16, 0.16]
    rail: [0.14, 0.14]
    brace: [0.16, 0.16]
    step: 0.42
    levels: [1.2]
    pattern: "no"
    infill: plaster
  fachwerk_cross:
    title: "fachwerk with crosses (under the windows)"
    generator: fachwerk
    post: [0.16, 0.18]
    threshold: [0.24, 0.16]
    plate: [0.16, 0.16]
    rail: [0.14, 0.14]
    brace: [0.14, 0.14]
    step: 1.1
    levels: [0.85, 2.0]
    pattern: crosses
    infill: plaster_ochre
    substance: oak
  log_oblo:
    title: "log house, round notch (with a remainder)"   # [s] remainder 1.25–1.5 diameters (log cribs), cup D/2, groove ≈ 0.5 D; log 0.22–0.32
    generator: log_house
    d: [0.24, 0.32]
    crown: 0.85                   # course height — a fraction of the diameter (the groove)
    remainder: 1.3                  # corner overhang — in diameters
    substance: pine_grey
    grooves: moss
    spread: 0.08
  log_lapa:
    title: "log house, lap joint (no remainder, hewn)"
    generator: log_house
    d: [0.24, 0.30]
    crown: 0.90
    remainder: 0.0
    boards: true                     # the outer side is hewn flat
    substance: pine
    grooves: moss
    spread: 0.07
  boards:
    title: "vertical cladding with battens"   # [p] boards 0.22–0.30, batten 0.06
    generator: cladding
    w: [0.22, 0.30]
    t: 0.03
    batten: [0.06, 0.025]
    substance: pine_grey
    spread: 0.10
  palisade:
    title: "palisade (tyn)"     # [s] the height of an ostrog wall is 2–3 sazhens (≈ 4–7 m, Brockhaus); log 0.25–0.32, pointed top
    generator: palisade
    d: [0.25, 0.32]
    h: [4.0, 4.6]
    tip: 0.5
    substance: pine_grey
    spread: 0.09
  wattle:
    title: "wattle"            # [p] stakes every 0.45 m, rods 2–3 cm, height 1.2–1.6 m
    generator: wattle
    d: [0.06, 0.08]
    h: [1.3, 1.5]
    step: 0.45
    rod: 0.025
    substance: oak
    spread: 0.12
